<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style_form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single+Ink:wght@100..900&family=Momo+Trust+Display&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Playwrite+DE+SAS:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&family=Satisfy&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body class="body-area">

    <div class="form-data">

        <form class="fields" action="">
            <div class="title">
                <p><strong>INFORMACIÓN DEL PIRATA</strong></p>
            </div>
            <div class="space-small">
                <input class="field-small" placeholder="Nombre*" type="text" required>
                <input class="field-small" placeholder="Apodo*" type="text" required><br>
            </div>
            <div class="space-small">
                <input class="field-small" placeholder="Tripulación*" type="text" required>
                <input class="field-small" placeholder="Puesto*" type="text" required><br>
            </div>
            <div class="space-small">
                <input class="field-small" placeholder="Fecha de Nacimiento" type="text" required>
                <input class="field-small" placeholder="Fruta del Diablo" type="text" required><br>
            </div>
            <div class="space-small">
                <input class="field-small" placeholder="Recompensa*" type="text" required>
                <input class="field-small" placeholder="Altura" type="text" required><br>
            </div>
            <div class="title02">
                <p><strong>APARICIÓN EN EL MANGA</strong></p>
                <p><strong>APARICIÓN EN EL ANIME</strong></p>
            </div>
            <div class="space-small">
                <input class="field-small" placeholder=" " type="date" required><br>
                <input class="field-small" placeholder=" " type="date" required><br>
            </div>
            <div>
                <textarea class="field-description" placeholder="Descripción" rows="9" cols="90"></textarea>
            </div>
            <div class="title">
                <p><strong>HAKI</strong></p>
            </div>
            <div class="haki-checkbox">
                <input type="checkbox"><label for="box">Conquistador</label>
                <input type="checkbox"><label for="box">Observación</label>
                <input type="checkbox"><label for="box">Armadura</label>
            </div>
            <button class="boton">ENVIAR DATOS</button>
            <div class="title">
                <p>2025 One Piece 1990-2025 Toei Animation | ShonenJump</p>
            </div>
        </form>
</body>

</html>
