<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Log Pose Code</title>
    <link rel="stylesheet" href="styleForm.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="body-area">

    <header class="header-area">
        <img class="header-logoImage" src="./images/Logotype.png">
    </header>

    <div class="container">
        <nav class="container-nav">
            <!-- Barra de busqueda-->
            <div class="nav-search">
                <form method="get" id="search-pirate">
                    <fieldset>
                        <input type="text" id="s" class="search-pirate" value="" placeholder="Buscar" />
                        <input class="search-button" type="submit" value="Buscar" />
                        <i class="search"></i>
                    </fieldset>
                </form>
            </div>
            <!-- Meter nuevos datos para un form-->
            <div>
                <p><button class="nav-buton">Nuevo Pirata</button></p>
            </div>

        </nav>

        <section class="container-form">

            <div>
                <p>Información sobre el nuevo pirata</p>
            </div>
            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Nombre:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>

            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Apodo:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>
            
            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Tripulación:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>

            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Puesto:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>

            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Recompensa:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>

            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Fruta del Diablo:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>
            
            <!--Opcion de boton-->
            <div class="form">
                <form action="" method="post">
                    <label for="POST-name">Vivo o no:</label>
                    <input id="POST-name" type="text" name="name"/>
                </form>
            </div>

        </section>

        <footer class="container-footer">
            <div class="footer-conditions">
                <p>Condiciones de uso</p>
                <p>Aviso de privacidad</p>
                <p>Página de Cookies</p>
                <p>Información legal</p>
            </div>

            <div>
                <p>2025 One Piece 1998-2025 Eichiro Oda | Toei Animation</p>
            </div>
        </footer>

    </div>
</body>

</html>
